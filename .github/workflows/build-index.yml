name: build play index

# nflverse republishes the whole season asset in place rather than shipping
# per-game deltas, so we rebuild on a schedule and publish only when the
# resulting artifact actually changed. A run that finds nothing changed costs
# under a minute of Actions time (free on a public repo) and publishes nothing,
# so the schedule errs on the side of too many slots.
#
# Two sources of lateness, both unpredictable:
#  - nflverse's updater (nflverse/nflverse-pbp, update_data.yaml) is cron'd at
#    09:03 UTC daily and 05:33 UTC Fri for TNF, and they also dispatch it from
#    outside GitHub at 04:30 and 09:00 UTC. In practice the TNF data has landed
#    anywhere from ~04:40 to 11:40 UTC (12:40-7:40 AM ET), and the daily
#    refresh anywhere from 10:00 to 17:00 UTC.
#  - GitHub delays scheduled runs: ours have fired 25 minutes to 6.5 hours
#    after the cron time (Oct 2026), and on a bad day every slot that day is
#    delayed, so spacing slots two hours apart is what keeps one landing before
#    breakfast.
# Minutes are off the hour on purpose; GitHub drops runs queued at :00.
on:
  schedule:
    - cron: "37 5 * * *"        # 05:37 UTC / 1:37 AM ET: game nights (TNF, SNF, MNF), after nflverse's 04:30 UTC dispatch
    - cron: "37 8 * * *"        # 08:37 UTC / 4:37 AM ET
    - cron: "37 10 * * *"       # 10:37 UTC / 6:37 AM ET, after nflverse's 09:03 UTC cron
    - cron: "37 12 * * *"       # 12:37 UTC / 8:37 AM ET
    - cron: "37 14 * * *"       # 14:37 UTC / 10:37 AM ET
    - cron: "37 17 * * *"       # 17:37 UTC / 1:37 PM ET: after nflverse's daily refresh, which lands 13:00-17:00 UTC
    - cron: "37 1 * * 1"        # Mon 01:37 UTC / Sun 9:37 PM ET, after the Sunday windows
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build, space separated"
        default: "2025 2026"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scheduled run gets no inputs, so this fallback -- not the
      # workflow_dispatch default above -- is what the daily build uses.
      # Add the new season here each September; nflverse publishes the
      # season's pbp asset before week 1, and building a season it has not
      # published yet fails the whole job.
      - name: Build index
        run: python3 build_index.py ${{ github.event.inputs.seasons || '2025 2026' }}

      - name: Compare with the published manifest
        id: diff
        run: |
          # content_hash is over every part's content id -- the rows, not the
          # gzip/SQLite bytes, which shift whenever the runner's zlib or SQLite
          # changes and would republish identical data for nothing.
          NEW=$(python3 -c "import json;print(json.load(open('data/dist/manifest.json'))['content_hash'])")
          OLD=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('content_hash',''))" 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Index unchanged ($NEW) - nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Index changed: ${OLD:-none} -> $NEW"
          fi

      - name: Write release notes
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 - <<'PY' > notes.md
          import json
          m = json.load(open("data/dist/manifest.json"))
          print("%d plays  ·  %d columns  ·  seasons %s"
                % (m["rows"], m["columns"], ", ".join(map(str, m["seasons"]))))
          print()
          print("Built from nflverse play-by-play plus FTN charting and participation;")
          print("players from nflverse players.csv, filled from each season's roster.")
          print("Published as parts: one file per completed season, one per week of the")
          print("newest season, one for players. Consumers poll `manifest.json` and")
          print("download only the parts whose content id changed.")
          print()
          for p in m["parts"]:
              print("    %-24s %7d rows  %6.2f MB  sha256 %s" % (p["file"], p["rows"], p["bytes"] / 1e6, p["sha256"][:16]))
          PY

      - name: Publish release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="index-$(date -u +%Y%m%d)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            data/dist/manifest.json data/dist/*.db.gz \
            --latest \
            --title "Play index $(date -u +%Y-%m-%d)" \
            --notes-file notes.md
